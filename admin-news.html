<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News Publishing - Commissioner of Agriculture</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;
      color: #222;
    }

    header {
      background: #006b35;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 850px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      color: #006b35;
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #006b35;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #004d26;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006b35;
      text-decoration: none;
      font-weight: bold;
    }

    .notice {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>News Publishing</h1>
  <p>Commissioner of Agriculture - Kogi State</p>
</header>

<div class="container">

  <div class="card">

    <h2>Add News</h2>

    <div class="notice">
      Fill in the information below to prepare a new news article.
      After submitting, the article will be displayed on this page.
    </div>

    <form id="newsForm">

      <label for="title">News Title</label>
      <input
        type="text"
        id="title"
        placeholder="Enter news title"
        required
      >

      <label for="date">News Date</label>
      <input
        type="date"
        id="date"
        required
      >

      <label for="image">News Image URL</label>
      <input
        type="text"
        id="image"
        placeholder="Paste image URL here"
      >

      <label for="content">News Content</label>
      <textarea
        id="content"
        placeholder="Write the full news story here..."
        required
      ></textarea>

      <button type="submit">Publish News</button>

    </form>

    <a href="news.html" class="back">← Back to News Page</a>

  </div>

</div>

<script>

  document.getElementById("newsForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const title = document.getElementById("title").value;
    const date = document.getElementById("date").value;
    const image = document.getElementById("image").value;
    const content = document.getElementById("content").value;

    const news = {
      title: title,
      date: date,
      image: image,
      content: content
    };

    let newsList = JSON.parse(localStorage.getItem("kogiNews")) || [];

    newsList.unshift(news);

    localStorage.setItem("kogiNews", JSON.stringify(newsList));

    alert("News published successfully!");

    document.getElementById("newsForm").reset();

  });

</script>

</body>
</html>
