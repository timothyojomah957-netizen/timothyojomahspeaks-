<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News - Commissioner of Agriculture, Kogi State</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;
      color: #222;
    }

    header {
      background: #006b35;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      background: #006b35;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
    }

    .news-card {
      background: white;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .news-card img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .news-card h2 {
      color: #006b35;
      margin-bottom: 8px;
      font-size: 23px;
    }

    .date {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .content {
      line-height: 1.7;
      font-size: 16px;
      white-space: pre-line;
    }

    /* SHARE BUTTON */

    .share-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #006b35;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .share-btn:hover {
      background: #004d26;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
    }

    .empty h2 {
      color: #006b35;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 40px;
      background: #006b35;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }

      .news-card h2 {
        font-size: 20px;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>Latest News</h1>
  <p>Commissioner of Agriculture - Kogi State</p>
</header>


<div class="container">

  <div class="top-buttons">

    <a href="index.html" class="button">
      ← Home
    </a>

    <a href="admin-news.html" class="button">
      + Publish News
    </a>

  </div>


  <div id="newsContainer"></div>

</div>


<footer>
  © 2026 Commissioner of Agriculture - Kogi State
</footer>


<script>

function displayNews() {

  const container =
    document.getElementById("newsContainer");

  const newsList =
    JSON.parse(
      localStorage.getItem("kogiNews")
    ) || [];


  if (newsList.length === 0) {

    container.innerHTML = `

      <div class="empty">

        <h2>No News Available</h2>

        <p>
          News updates will appear here
          when they are published.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML = "";


  newsList.forEach(function(news, index) {

    const article =
      document.createElement("article");

    article.className = "news-card";


    let image = "";

    if (news.image) {

      image = `
        <img
          src="${news.image}"
          alt="News Image"
        >
      `;

    }


    article.innerHTML = `

      ${image}

      <h2>
        ${escapeHTML(news.title)}
      </h2>

      <div class="date">
        Published: ${escapeHTML(news.date)}
      </div>

      <div class="content">
        ${escapeHTML(news.content)}
      </div>

      <button
        class="share-btn"
        onclick="shareNews(${index})"
      >
        📤 SHARE THIS NEWS
      </button>

    `;


    container.appendChild(article);

  });

}


/* SHARE FUNCTION */

function shareNews(index) {

  const newsList =
    JSON.parse(
      localStorage.getItem("kogiNews")
    ) || [];


  const news = newsList[index];


  if (!news) {

    alert("News could not be found.");

    return;

  }


  const text =
    news.title +
    "\n\n" +
    news.content +
    "\n\n" +
    window.location.href;


  if (navigator.share) {

    navigator.share({

      title: news.title,

      text: news.content,

      url: window.location.href

    })

    .catch(function(error) {

      console.log(error);

    });

  }

  else {

    navigator.clipboard.writeText(text)

      .then(function() {

        alert(
          "News copied. You can paste it on WhatsApp, Facebook or another platform."
        );

      })

      .catch(function() {

        alert(
          "Sharing is not supported on this browser."
        );

      });

  }

}


/* SECURITY */

function escapeHTML(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


displayNews();

</script>

</body>
</html>
