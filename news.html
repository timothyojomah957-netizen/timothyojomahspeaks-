<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Latest News - Kogi State Agriculture</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;
      color: #222;
    }

    header {
      background: #008000;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      background: #008000;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
    }

    .button:hover {
      background: #005c00;
    }

    .news-card {
      background: white;
      margin-bottom: 30px;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    .news-card img {
      display: block;
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .news-card h2 {
      color: #008000;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .date {
      color: #777;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .content {
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-line;
    }

    .share-area {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .share-btn,
    .copy-btn {
      border: none;
      color: white;
      padding: 11px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .share-btn {
      background: #25D366;
    }

    .copy-btn {
      background: #008000;
    }

    .share-btn:hover {
      background: #1da851;
    }

    .copy-btn:hover {
      background: #005c00;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .empty h2 {
      color: #008000;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 40px;
      background: #004d00;
      color: white;
      text-align: center;
      padding: 25px 15px;
      font-size: 14px;
    }

    footer p {
      margin: 5px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 24px;
      }

      .news-card h2 {
        font-size: 21px;
      }

      .top-buttons {
        flex-direction: column;
      }

      .button {
        text-align: center;
      }

      .share-area {
        flex-direction: column;
      }

      .share-btn,
      .copy-btn {
        width: 100%;
      }

    }
  </style>
</head>

<body>

<header>

  <h1>Latest News</h1>

  <p>
    Commissioner of Agriculture and Food Security - Kogi State
  </p>

</header>

<div class="container">

  <div class="top-buttons">

    <a href="index.html" class="button">
      ← Home
    </a>

    <a href="admin-news.html" class="button">
      + Publish News
    </a>

  </div>

  <div id="newsContainer"></div>

</div>

<footer>

  <p>
    <strong>Kogi State Ministry of Agriculture</strong>
  </p>

  <p>
    © 2026 Kogi State Ministry of Agriculture.
    All Rights Reserved.
  </p>

</footer>

<script>

function displayNews() {

  const newsContainer =
    document.getElementById("newsContainer");

  let newsList =
    JSON.parse(
      localStorage.getItem("kogiNews")
    ) || [];


  if (newsList.length === 0) {

    newsContainer.innerHTML = `
      <div class="empty">

        <h2>No News Available</h2>

        <p>
          News updates will appear here when they are published.
        </p>

      </div>
    `;

    return;
  }


  newsContainer.innerHTML = "";


  newsList.forEach(function(news, index) {

    let imageHTML = "";


    if (
      news.image &&
      news.image.trim() !== ""
    ) {

      imageHTML = `
        <img
          src="${news.image}"
          alt="${escapeHTML(news.title)}"
        >
      `;

    }


    const newsItem =
      document.createElement("article");

    newsItem.className = "news-card";


    newsItem.innerHTML = `

      ${imageHTML}

      <h2>
        ${escapeHTML(news.title)}
      </h2>

      <div class="date">
        Published: ${escapeHTML(news.date)}
      </div>

      <div class="content">
        ${escapeHTML(news.content)}
      </div>

      <div class="share-area">

        <button
          class="share-btn"
          onclick="shareNews(${index})"
        >
          📤 Share News
        </button>

        <button
          class="copy-btn"
          onclick="copyNewsLink()"
        >
          🔗 Copy Page Link
        </button>

      </div>

    `;


    newsContainer.appendChild(newsItem);

  });

}


/* SHARE NEWS */

function shareNews(index) {

  const newsList =
    JSON.parse(
      localStorage.getItem("kogiNews")
    ) || [];


  const news = newsList[index];


  if (!news) {
    return;
  }


  const shareData = {

    title: news.title,

    text:
      news.title +
      "\n\n" +
      news.content,

    url: window.location.href

  };


  if (navigator.share) {

    navigator.share(shareData)
      .catch(function(error) {

        console.log(
          "Sharing cancelled:",
          error
        );

      });

  } else {

    const whatsappText =
      encodeURIComponent(
        news.title +
        "\n\n" +
        news.content +
        "\n\n" +
        window.location.href
      );


    window.open(
      "https://wa.me/?text=" +
      whatsappText,
      "_blank"
    );

  }

}


/* COPY PAGE LINK */

function copyNewsLink() {

  const link =
    window.location.href;


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard.writeText(link)
      .then(function() {

        alert(
          "News page link copied successfully."
        );

      });

  } else {

    alert(
      "Copy this link:\n\n" +
      link
    );

  }

}


/* SECURITY */

function escapeHTML(text) {

  if (!text) {
    return "";
  }

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


displayNews();

</script>

</body>
</html>
