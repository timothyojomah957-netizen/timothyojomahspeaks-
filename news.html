<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News - Commissioner of Agriculture, Kogi State</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f4;
      color: #222;
    }

    header {
      background: #006b35;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .top-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      background: #006b35;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      background: #004d26;
    }

    .news-card {
      background: white;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .news-card img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .news-card h2 {
      color: #006b35;
      margin-bottom: 8px;
      font-size: 23px;
    }

    .date {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .content {
      line-height: 1.7;
      font-size: 16px;
      white-space: pre-line;
    }

    .share-button {
      display: inline-block;
      margin-top: 18px;
      background: #006b35;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .share-button:hover {
      background: #004d26;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .empty h2 {
      color: #006b35;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 40px;
      background: #006b35;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 23px;
      }

      .news-card h2 {
        font-size: 20px;
      }

      .share-button {
        width: 100%;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>Latest News</h1>
  <p>Commissioner of Agriculture - Kogi State</p>
</header>

<div class="container">

  <div class="top-buttons">

    <a
      href="index.html"
      class="button"
    >
      ← Home
    </a>

    <a
      href="admin-news.html"
      class="button"
    >
      + Publish News
    </a>

  </div>

  <div id="newsContainer"></div>

</div>

<footer>
  © 2026 Commissioner of Agriculture - Kogi State
</footer>


<script>

function displayNews() {

  const newsContainer =
    document.getElementById("newsContainer");


  let newsList =
    JSON.parse(
      localStorage.getItem("kogiNews")
    ) || [];


  if (newsList.length === 0) {

    newsContainer.innerHTML = `

      <div class="empty">

        <h2>No News Available</h2>

        <p>
          News updates will appear here
          when they are published.
        </p>

      </div>

    `;

    return;
  }


  newsContainer.innerHTML = "";


  newsList.forEach(function(news, index) {

    let imageHTML = "";


    if (
      news.image &&
      news.image.trim() !== ""
    ) {

      imageHTML = `

        <img
          src="${news.image}"
          alt="${escapeHTML(news.title)}"
        >

      `;

    }


    const newsItem =
      document.createElement("article");


    newsItem.className = "news-card";


    newsItem.innerHTML = `

      ${imageHTML}

      <h2>
        ${escapeHTML(news.title)}
      </h2>

      <div class="date">
        Published: ${escapeHTML(news.date)}
      </div>

      <div class="content">
        ${escapeHTML(news.content)}
      </div>

      <button
        class="share-button"
        onclick="shareNews(${index})"
      >
        📤 Share News
      </button>

    `;


    newsContainer.appendChild(newsItem);

  });

}


/* SHARE NEWS */

async function shareNews(index) {

  const newsList =
    JSON.parse(
      localStorage.getItem("kogiNews")
    ) || [];


  const news = newsList[index];


  if (!news) {
    return;
  }


  const shareText =
    news.title +
    "\n\n" +
    news.content;


  const shareData = {

    title: news.title,

    text: shareText,

    url: window.location.href

  };


  try {

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare(shareData)
    ) {

      await navigator.share(shareData);

    }

    else if (navigator.share) {

      await navigator.share({

        title: news.title,

        text: shareText,

        url: window.location.href

      });

    }

    else {

      await navigator.clipboard.writeText(

        news.title +
        "\n\n" +
        news.content +
        "\n\n" +
        window.location.href

      );

      alert(
        "News link and story copied. You can now paste it into WhatsApp or another app."
      );

    }

  }

  catch (error) {

    if (error.name !== "AbortError") {

      alert(
        "Unable to open the sharing menu."
      );

    }

  }

}


/* SECURITY */

function escapeHTML(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


displayNews();

</script>

</body>
</html>
