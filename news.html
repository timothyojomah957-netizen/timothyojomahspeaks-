<script>

let newsData = JSON.parse(
    localStorage.getItem("websiteNews")
) || [];

const newNews = document.getElementById("newNews");

function displayNews() {

    newNews.innerHTML = "";

    newsData.forEach(function(news) {

        const article = document.createElement("article");

        article.className = "news-card";

        article.innerHTML = `

            ${
                news.image
                ? `
                <img
                    src="${news.image}"
                    alt="${news.headline}"
                >
                `
                : ""
            }

            <h2>
                ${news.headline}
            </h2>

            <div class="date">
                📅 Published: ${news.date}
            </div>

            <div class="summary">
                ${news.content}
            </div>

            <a
                href="#"
                class="read-button"
            >
                Read Full Story →
            </a>

        `;

        newNews.appendChild(article);

    });

}

displayNews();

</script>
