<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publish News</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f4;
    padding:20px;
}

.container{
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    color:#008000;
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

textarea{
    height:180px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:7px;
    background:#008000;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#005c00;
}

.preview{
    width:100%;
    max-height:350px;
    object-fit:cover;
    margin-top:15px;
    border-radius:8px;
    display:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#008000;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>📰 Publish News</h1>

<form id="newsForm">

<label>News Headline</label>

<input
    type="text"
    id="headline"
    placeholder="Enter news headline"
    required
>

<label>Date</label>

<input
    type="date"
    id="date"
    required
>

<label>News Picture</label>

<input
    type="file"
    id="image"
    accept="image/*"
    required
>

<img
    id="preview"
    class="preview"
    alt="Picture Preview"
>

<label>News Story</label>

<textarea
    id="content"
    placeholder="Write your news story here..."
    required
></textarea>

<button type="submit">
    📢 Publish News
</button>

</form>

<a href="news.html" class="back">
    ← Go to News Page
</a>

</div>

<script>

const imageInput =
    document.getElementById("image");

const preview =
    document.getElementById("preview");


/* PICTURE PREVIEW */

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            preview.src = e.target.result;

            preview.style.display = "block";

        };

        reader.readAsDataURL(file);

    }

});


/* PUBLISH NEWS */

document
.getElementById("newsForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const headline =
        document.getElementById("headline").value.trim();

    const date =
        document.getElementById("date").value;

    const content =
        document.getElementById("content").value.trim();

    const file =
        imageInput.files[0];


    if(!file){

        alert("Please select a picture.");

        return;

    }


    const reader = new FileReader();


    reader.onload = function(e){

        const news = {

            id: Date.now(),

            headline: headline,

            date: date,

            content: content,

            image: e.target.result

        };


        let newsData =
            JSON.parse(
                localStorage.getItem("websiteNews")
            ) || [];


        newsData.unshift(news);


        localStorage.setItem(
            "websiteNews",
            JSON.stringify(newsData)
        );


        alert("✅ News published successfully!");


        window.location.href =
            "news.html";

    };


    reader.readAsDataURL(file);

});

</script>

</body>
</html>
