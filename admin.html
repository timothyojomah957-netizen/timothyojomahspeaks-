<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - News Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #006b35;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 7px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 850px;
      margin: 25px auto;
    }

    .admin-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .admin-box h2 {
      color: #006b35;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #006b35;
    }

    textarea {
      min-height: 250px;
      resize: vertical;
      line-height: 1.6;
    }

    .hint {
      color: #666;
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
    }

    .preview {
      display: none;
      margin-top: 15px;
      text-align: center;
    }

    .preview img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
    }

    .preview-text {
      color: #006b35;
      font-weight: bold;
      margin-top: 8px;
    }

    .publish-btn {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 6px;
      background: #006b35;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .publish-btn:hover {
      background: #00552b;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 6px;
      text-align: center;
      background: #d9f5e5;
      color: #006b35;
      font-weight: bold;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006b35;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
      }

      .admin-box {
        padding: 18px;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>
    News Administration
  </h1>

  <p>
    Ministry of Agriculture & Food Security, Kogi State
  </p>

</header>


<div class="container">

  <div class="admin-box">

    <h2>
      Publish News
    </h2>


    <!-- NEWS HEADLINE -->

    <label for="headline">
      News Headline
    </label>

    <input
      type="text"
      id="headline"
      placeholder="Enter news headline"
    >


    <!-- IMAGE LINK -->

    <label for="image">
      News Picture
    </label>

    <input
      type="url"
      id="image"
      placeholder="Paste direct ImgBB image link here"
    >

    <div class="hint">

      Example:
      https://i.ibb.co/xxxxx/your-picture.jpg

      <br>

      Make sure you paste the direct image link,
      not the ImgBB webpage link.

    </div>


    <!-- IMAGE PREVIEW -->

    <div
      class="preview"
      id="preview"
    >

      <img
        id="previewImage"
        src=""
        alt="News picture preview"
      >

      <div class="preview-text">
        Picture Preview
      </div>

    </div>


    <!-- NEWS CONTENT -->

    <label for="content">
      News Content
    </label>

    <textarea
      id="content"
      placeholder="Write your news story here..."
    ></textarea>


    <!-- PUBLISH BUTTON -->

    <button
      class="publish-btn"
      onclick="publishNews()"
    >
      Publish News
    </button>


    <div
      id="message"
      class="message"
    >
      News published successfully!
    </div>

  </div>


  <a
    href="news.html"
    class="back-btn"
  >
    ← View Latest News
  </a>

</div>


<script>

  const imageInput =
    document.getElementById("image");

  const preview =
    document.getElementById("preview");

  const previewImage =
    document.getElementById("previewImage");


  /*
    IMAGE PREVIEW
  */

  imageInput.addEventListener(
    "input",
    function() {

      const imageURL =
        imageInput.value.trim();


      if (imageURL) {

        previewImage.src =
          imageURL;

        preview.style.display =
          "block";

      } else {

        preview.style.display =
          "none";

      }

    }
  );


  /*
    PUBLISH NEWS
  */

  function publishNews() {

    const headline =
      document
        .getElementById("headline")
        .value
        .trim();


    const image =
      document
        .getElementById("image")
        .value
        .trim();


    const content =
      document
        .getElementById("content")
        .value
        .trim();


    if (!headline) {

      alert(
        "Please enter the news headline."
      );

      return;

    }


    if (!image) {

      alert(
        "Please paste the direct ImgBB picture link."
      );

      return;

    }


    if (!content) {

      alert(
        "Please write the news content."
      );

      return;

    }


    const news = {

      id: Date.now(),

      headline: headline,

      image: image,

      content: content,

      date:
        new Date().toLocaleDateString(
          "en-US",
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        )

    };


    let newsData =
      JSON.parse(
        localStorage.getItem(
          "websiteNews"
        )
      ) || [];


    newsData.unshift(news);


    try {

      localStorage.setItem(
        "websiteNews",
        JSON.stringify(
          newsData
        )
      );

    } catch(error) {

      alert(
        "The news could not be saved. Please try again."
      );

      return;

    }


    document
      .getElementById("message")
      .style.display =
      "block";


    document
      .getElementById("headline")
      .value = "";


    document
      .getElementById("image")
      .value = "";


    document
      .getElementById("content")
      .value = "";


    preview.style.display =
      "none";


    /*
      OPEN NEWS PAGE
    */

    setTimeout(
      function() {

        window.location.href =
          "news.html";

      },
      1000
    );

  }

</script>

</body>
</html>
