<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - News Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #006b35;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }

    .admin-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .admin-box h2 {
      color: #006b35;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #006b35;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .image-preview {
      margin-top: 15px;
      display: none;
      text-align: center;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 6px;
      background: #006b35;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00552b;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #d9f5e5;
      color: #006b35;
    }

    .news-list {
      margin-top: 30px;
    }

    .news-item {
      background: white;
      margin-top: 15px;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .news-item h3 {
      color: #006b35;
      margin-bottom: 8px;
    }

    .news-item img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 7px;
      margin: 10px 0;
    }

    .news-item p {
      line-height: 1.6;
    }

    .delete-btn {
      background: #b00020;
      margin-top: 15px;
    }

    .delete-btn:hover {
      background: #8b0019;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006b35;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
        padding: 12px;
      }

      .admin-box {
        padding: 18px;
      }

      header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>News Administration</h1>
  <p>Ministry of Agriculture & Food Security, Kogi State</p>
</header>

<div class="container">

  <div class="admin-box">

    <h2>Publish News</h2>

    <form id="newsForm">

      <label for="headline">News Headline</label>
      <input
        type="text"
        id="headline"
        placeholder="Enter news headline"
        required
      >

      <label for="image">News Image URL</label>
      <input
        type="url"
        id="image"
        placeholder="Paste your image link here"
      >

      <div class="image-preview" id="imagePreview">
        <img id="previewImage" src="" alt="Image Preview">
      </div>

      <label for="content">News Content</label>
      <textarea
        id="content"
        placeholder="Write your news story here..."
        required
      ></textarea>

      <button type="submit">
        Publish News
      </button>

    </form>

    <div id="message" class="message success">
      News published successfully!
    </div>

  </div>

  <div class="news-list">

    <h2>Published News</h2>

    <div id="publishedNews"></div>

  </div>

  <a href="news.html" class="back-btn">
    ← Back to News Page
  </a>

</div>

<script>

  const newsForm = document.getElementById("newsForm");
  const headline = document.getElementById("headline");
  const image = document.getElementById("image");
  const content = document.getElementById("content");
  const message = document.getElementById("message");
  const publishedNews = document.getElementById("publishedNews");

  let newsData = JSON.parse(localStorage.getItem("websiteNews")) || [];

  // Image preview
  image.addEventListener("input", function () {

    const imagePreview = document.getElementById("imagePreview");
    const previewImage = document.getElementById("previewImage");

    if (this.value.trim() !== "") {

      previewImage.src = this.value;
      imagePreview.style.display = "block";

    } else {

      imagePreview.style.display = "none";

    }
  });

  // Publish news
  newsForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const newNews = {

      id: Date.now(),

      headline: headline.value.trim(),

      image: image.value.trim(),

      content: content.value.trim(),

      date: new Date().toLocaleDateString()

    };

    newsData.unshift(newNews);

    localStorage.setItem(
      "websiteNews",
      JSON.stringify(newsData)
    );

    message.style.display = "block";

    newsForm.reset();

    document.getElementById("imagePreview").style.display = "none";

    displayNews();

    setTimeout(function() {

      message.style.display = "none";

    }, 3000);

  });


  // Display published news
  function displayNews() {

    publishedNews.innerHTML = "";

    if (newsData.length === 0) {

      publishedNews.innerHTML =
        "<p>No news published yet.</p>";

      return;

    }

    newsData.forEach(function(news) {

      const item = document.createElement("div");

      item.className = "news-item";

      item.innerHTML = `

        <h3>${escapeHTML(news.headline)}</h3>

        <small>Published: ${news.date}</small>

        ${
          news.image
          ? `<img src="${news.image}" alt="News Image">`
          : ""
        }

        <p>${escapeHTML(news.content)}</p>

        <button
          class="delete-btn"
          onclick="deleteNews(${news.id})"
        >
          Delete News
        </button>

      `;

      publishedNews.appendChild(item);

    });

  }


  // Delete news
  function deleteNews(id) {

    if (!confirm("Are you sure you want to delete this news?")) {
      return;
    }

    newsData = newsData.filter(function(news) {

      return news.id !== id;

    });

    localStorage.setItem(
      "websiteNews",
      JSON.stringify(newsData)
    );

    displayNews();

  }


  // Protect against HTML injection
  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // Load existing news
  displayNews();

</script>

</body>
</html>
