<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - News Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #006b35;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }

    .admin-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .admin-box h2 {
      color: #006b35;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #006b35;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .file-box {
      border: 2px dashed #006b35;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #f8fffa;
      cursor: pointer;
      margin-top: 5px;
    }

    .file-box p {
      color: #006b35;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .file-box small {
      color: #666;
    }

    #imageFile {
      display: none;
    }

    .image-preview {
      margin-top: 15px;
      display: none;
      text-align: center;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 350px;
      border-radius: 8px;
    }

    .image-name {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 6px;
      background: #006b35;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00552b;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #d9f5e5;
      color: #006b35;
    }

    .news-list {
      margin-top: 30px;
    }

    .news-item {
      background: white;
      margin-top: 15px;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .news-item h3 {
      color: #006b35;
      margin-bottom: 8px;
    }

    .news-item img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 7px;
      margin: 10px 0;
    }

    .news-item p {
      line-height: 1.6;
      white-space: pre-line;
    }

    .delete-btn {
      background: #b00020;
      margin-top: 15px;
    }

    .delete-btn:hover {
      background: #8b0019;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006b35;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .container {
        margin: 15px auto;
        padding: 12px;
      }

      .admin-box {
        padding: 18px;
      }

      header h1 {
        font-size: 21px;
      }

    }
  </style>
</head>

<body>

<header>

  <h1>News Administration</h1>

  <p>
    Ministry of Agriculture & Food Security, Kogi State
  </p>

</header>


<div class="container">

  <div class="admin-box">

    <h2>Publish News</h2>

    <form id="newsForm">


      <label for="headline">
        News Headline
      </label>

      <input
        type="text"
        id="headline"
        placeholder="Enter news headline"
        required
      >


      <label>
        News Picture
      </label>

      <label for="imageFile" class="file-box">

        <p>📷 Choose Picture</p>

        <small>
          Tap here to select a picture from your phone
        </small>

      </label>

      <input
        type="file"
        id="imageFile"
        accept="image/*"
      >


      <div
        class="image-preview"
        id="imagePreview"
      >

        <img
          id="previewImage"
          src=""
          alt="Selected News Picture"
        >

        <div
          class="image-name"
          id="imageName"
        ></div>

      </div>


      <label for="content">
        News Content
      </label>

      <textarea
        id="content"
        placeholder="Write your news story here..."
        required
      ></textarea>


      <button type="submit">
        Publish News
      </button>

    </form>


    <div
      id="message"
      class="message success"
    >
      News published successfully!
    </div>

  </div>


  <div class="news-list">

    <h2>Published News</h2>

    <div id="publishedNews"></div>

  </div>


  <a
    href="news.html"
    class="back-btn"
  >
    ← Back to News Page
  </a>

</div>


<script>

  const newsForm =
    document.getElementById("newsForm");

  const headline =
    document.getElementById("headline");

  const imageFile =
    document.getElementById("imageFile");

  const content =
    document.getElementById("content");

  const message =
    document.getElementById("message");

  const publishedNews =
    document.getElementById("publishedNews");

  const imagePreview =
    document.getElementById("imagePreview");

  const previewImage =
    document.getElementById("previewImage");

  const imageName =
    document.getElementById("imageName");


  let newsData =
    JSON.parse(
      localStorage.getItem("websiteNews")
    ) || [];


  /*
    SELECT PICTURE
  */

  imageFile.addEventListener(
    "change",
    function() {

      const file = this.files[0];

      if (!file) {

        imagePreview.style.display = "none";

        return;

      }


      if (!file.type.startsWith("image/")) {

        alert("Please select an image file.");

        this.value = "";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          previewImage.src =
            event.target.result;

          imageName.textContent =
            file.name;

          imagePreview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


  /*
    PUBLISH NEWS
  */

  newsForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const file =
        imageFile.files[0];


      let imageData = "";


      if (file) {

        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            imageData =
              event.target.result;

            saveNews(imageData);

          };


        reader.readAsDataURL(file);

      } else {

        saveNews("");

      }

    }
  );


  /*
    SAVE NEWS
  */

  function saveNews(imageData) {

    const newNews = {

      id: Date.now(),

      headline:
        headline.value.trim(),

      image:
        imageData,

      content:
        content.value.trim(),

      date:
        new Date().toLocaleDateString()

    };


    newsData.unshift(newNews);


    try {

      localStorage.setItem(
        "websiteNews",
        JSON.stringify(newsData)
      );

    } catch (error) {

      alert(
        "The picture is too large for browser storage. We will need to connect online storage next."
      );

      return;

    }


    message.style.display =
      "block";


    newsForm.reset();


    imagePreview.style.display =
      "none";


    imageName.textContent =
      "";


    displayNews();


    setTimeout(
      function() {

        message.style.display =
          "none";

      },
      3000
    );

  }


  /*
    DISPLAY NEWS
  */

  function displayNews() {

    publishedNews.innerHTML =
      "";


    if (newsData.length === 0) {

      publishedNews.innerHTML =
        "<p>No news published yet.</p>";

      return;

    }


    newsData.forEach(
      function(news) {

        const item =
          document.createElement("div");


        item.className =
          "news-item";


        item.innerHTML = `

          <h3>
            ${escapeHTML(news.headline)}
          </h3>

          <small>
            Published: ${escapeHTML(news.date)}
          </small>

          ${
            news.image
            ?
            `
            <img
              src="${news.image}"
              alt="News Image"
            >
            `
            :
            ""
          }

          <p>
            ${escapeHTML(news.content)}
          </p>

          <button
            class="delete-btn"
            onclick="deleteNews(${news.id})"
          >
            Delete News
          </button>

        `;


        publishedNews.appendChild(item);

      }
    );

  }


  /*
    DELETE NEWS
  */

  function deleteNews(id) {

    if (
      !confirm(
        "Are you sure you want to delete this news?"
      )
    ) {

      return;

    }


    newsData =
      newsData.filter(
        function(news) {

          return news.id !== id;

        }
      );


    localStorage.setItem(
      "websiteNews",
      JSON.stringify(newsData)
    );


    displayNews();

  }


  /*
    PROTECT TEXT
  */

  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text || "";

    return div.innerHTML;

  }


  /*
    LOAD NEWS
  */

  displayNews();

</script>

</body>
</html>
